[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "levelup-bench"
version = "0.1.0a0"
description = "A benchmark for transferable superhuman optimization under verifiable constraints"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
ml = [
  "torch>=2.4,<3",
]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/levelup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Keep CI focused on correctness and import hygiene. More opinionated Ruff families can be
# adopted deliberately later instead of changing frozen experiment code to satisfy new defaults.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Historical Milestone 5 source retains this harmless type import. Avoid rewriting the frozen
# experiment solely for lint while still applying F401 to new code.
"src/levelup/experiments/milestone5.py" = ["F401"]
# These tests intentionally call pytest.importorskip("torch") before importing LevelUp modules
# that themselves import torch. Moving those imports would defeat the optional-dependency guard.
"tests/test_milestone4.py" = ["E402"]
"tests/test_milestone5.py" = ["E402"]
