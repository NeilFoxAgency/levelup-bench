name: milestone5-reference

on:
  push:
    branches:
      - milestone5-staging
  pull_request:
    branches:
      - main

jobs:
  reference:
    if: github.head_ref == 'milestone5-staging' || github.ref == 'refs/heads/milestone5-staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[ml]"
      - name: Run frozen reference experiment
        run: python -m levelup.experiments.milestone5 > milestone5_reference.json
      - uses: actions/upload-artifact@v4
        with:
          name: milestone5-reference-final
          path: milestone5_reference.json
